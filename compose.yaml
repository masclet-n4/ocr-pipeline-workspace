services:
  ocr:
    build:
      context: ./tiny-ocr
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PB_URL: "${PB_URL:-http://host.docker.internal:8090}"
      OCR_RENDER_SCALE: "${OCR_RENDER_SCALE:-1.5}"
      OCR_MEMORY_TRIM: "${OCR_MEMORY_TRIM:-1}"
      TESSERACT_LANG: "${TESSERACT_LANG:-spa+eng}"
      TESSERACT_PSM: "${TESSERACT_PSM:-3}"
      OCR_ISOLATE_PROCESS: "${OCR_ISOLATE_PROCESS:-1}"
      RUSTFS_ENDPOINT: "${RUSTFS_ENDPOINT:-http://host.docker.internal:9000}"
      RUSTFS_BUCKET: "${RUSTFS_BUCKET:-ocr-results}"
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-change-me}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-change-me}"
      RUSTFS_REGION: "${RUSTFS_REGION:-us-east-1}"
    ports:
      - "${OCR_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:3000/alive', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  interpreter:
    build:
      context: ./ai-interpreter
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "3002"
      RUSTFS_ENDPOINT: "${RUSTFS_ENDPOINT:-http://host.docker.internal:9000}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-openai/gpt-5-nano}"
      INTERPRETER_MAX_TEXT_BYTES: "${INTERPRETER_MAX_TEXT_BYTES:-524288}"
      OPENROUTER_MAX_TOKENS: "${OPENROUTER_MAX_TOKENS:-4096}"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - >-
          fetch('http://localhost:3002/alive')
          .then(r => { if (!r.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  gateway:
    build:
      context: ./tiny-ocr-gateway
    restart: unless-stopped
    depends_on:
      ocr:
        condition: service_healthy
      interpreter:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      PB_URL: "${PB_URL:-http://host.docker.internal:8090}"
      OCR_BASE_URL: "http://ocr:3000"
      INTERPRETER_BASE_URL: "http://interpreter:3002"
      RUSTFS_ENDPOINT: "${RUSTFS_ENDPOINT:-http://host.docker.internal:9000}"
      RUSTFS_BUCKET: "${RUSTFS_BUCKET:-ocr-results}"
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-change-me}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-change-me}"
      RUSTFS_REGION: "${RUSTFS_REGION:-us-east-1}"
      RUSTFS_URL_EXPIRES_SECONDS: "${RUSTFS_URL_EXPIRES_SECONDS:-300}"
    ports:
      - "${OCR_FRONT_PORT:-3001}:3001"
    security_opt:
      - no-new-privileges:true
